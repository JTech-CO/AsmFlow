name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asmflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: Repository contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check shell syntax
        run: |
          bash -n scripts/package.sh
          bash -n examples/curl-chat-completions.sh
          bash -n examples/curl-responses.sh

      # This job has no toolchain on purpose: M0's gate must hold on a machine
      # with Python and Make and nothing else. `check-buildless` pins
      # BUILD_DIR at a path that holds no build, so the condition is asserted
      # here rather than inherited from whatever the runner image happens to
      # contain — and is reproducible on a developer machine that has built.
      - name: Validate repository and run tests
        run: make check-buildless

  build:
    name: Build and milestone gates
    runs-on: ubuntu-24.04
    # The build runs inside Debian trixie rather than on the runner image.
    # `libllhttp-dev` is not packaged for Ubuntu 24.04, and pinning the
    # distribution also means CI compiles against the same library versions the
    # milestone gates were verified against, rather than whichever the hosted
    # image happens to carry.
    container:
      image: debian:trixie
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git \
            nasm gcc binutils make pkg-config \
            libllhttp-dev libcurl4-openssl-dev libsqlite3-dev \
            libjansson-dev libncurses-dev \
            valgrind gdb \
            python3

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Record toolchain versions
        run: make toolchain-versions

      # CI and local development run the same targets (AGENTS.md; M1 DoD 5).
      - name: M0 gate - specification and contracts
        run: make check

      - name: M1 gate - toolchain and build foundation
        run: make gate-m1

      - name: M2 gate - ABI, memory, and core primitives
        run: make gate-m2

      - name: M3 gate - JSON, configuration, and secret references
        run: make gate-m3

      - name: M4 gate - SQLite, migrations, and the control plane
        run: make gate-m4

      - name: M5 gate - gateway HTTP listener and contract
        run: make gate-m5

      - name: M6 gate - upstream client, Responses/Chat, and streaming
        run: make gate-m6

      - name: M7 gate - routing, health, circuit breaking, and fallback
        run: make gate-m7

      - name: GDB smoke check
        run: make gdb-abi-smoke
